name: Publish to npm

# Publishes every packages/* workspace via scripts/publish.ts using npm trusted
# publishing (OIDC): no NPM_TOKEN secret is used and provenance is attached
# automatically. Register this repository + publish.yml (environment "npm") as
# the trusted publisher for each @kanabun/* package on npmjs.com before running.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: ".bun-version"

      # publish.ts shells out to `npm publish`; trusted publishing needs npm 11.5.1+.
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          check-latest: true
          registry-url: https://registry.npmjs.org
      - name: Use npm 12
        run: npm install -g npm@12.2.2

      - run: bun install --frozen-lockfile

      # Runs the pre-publish checks (tests, typecheck, example builds) first.
      - run: bun run scripts/publish.ts --yes
